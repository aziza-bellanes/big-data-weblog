# Direct canonical raw ingestion. Unparseable timestamps use dt=1970-01-01.
agent1.sources  = tail
agent1.channels = disk
agent1.sinks    = hdfs

# --- Source -----------------------------------------------------------------
agent1.sources.tail.type               = TAILDIR
agent1.sources.tail.channels           = disk
agent1.sources.tail.filegroups         = access
agent1.sources.tail.filegroups.access  = /data/live/access.log
agent1.sources.tail.positionFile       = /var/lib/flume/taildir-position.json
agent1.sources.tail.batchSize          = 500

agent1.sources.tail.interceptors                          = fallback eventtime
agent1.sources.tail.interceptors.eventtime.type           = regex_extractor
agent1.sources.tail.interceptors.eventtime.regex          = \\[(\\d{2}/[A-Za-z]{3}/\\d{4}:\\d{2}:\\d{2}:\\d{2})
agent1.sources.tail.interceptors.eventtime.serializers    = millis
agent1.sources.tail.interceptors.eventtime.serializers.millis.type    = org.apache.flume.interceptor.RegexExtractorInterceptorMillisSerializer
agent1.sources.tail.interceptors.eventtime.serializers.millis.name    = timestamp
agent1.sources.tail.interceptors.eventtime.serializers.millis.pattern = dd/MMM/yyyy:HH:mm:ss

# --- Channel: file-backed so buffered events survive a restart ---------------
agent1.channels.disk.type                = file
agent1.channels.disk.checkpointDir       = /var/lib/flume/checkpoint
agent1.channels.disk.dataDirs            = /var/lib/flume/data
agent1.channels.disk.capacity            = 1000000
agent1.channels.disk.transactionCapacity = 10000


agent1.sources.tail.interceptors.fallback.type = static
agent1.sources.tail.interceptors.fallback.key = timestamp
agent1.sources.tail.interceptors.fallback.value = 0

# --- Sink -------------------------------------------------------------------
# Files being written start with "_" so Hive never reads a half-written file.
agent1.sinks.hdfs.type                = hdfs
agent1.sinks.hdfs.channel             = disk
agent1.sinks.hdfs.hdfs.path           = hdfs://hadoop:9000/data/nasa/raw/flume/dt=%Y-%m-%d
agent1.sinks.hdfs.hdfs.timeZone       = UTC
agent1.sinks.hdfs.hdfs.filePrefix     = weblogs
agent1.sinks.hdfs.hdfs.inUsePrefix    = _
agent1.sinks.hdfs.hdfs.fileType       = DataStream
agent1.sinks.hdfs.hdfs.writeFormat    = Text
agent1.sinks.hdfs.hdfs.batchSize      = 1000
agent1.sinks.hdfs.hdfs.rollInterval   = 30
agent1.sinks.hdfs.hdfs.rollSize       = 134217728
agent1.sinks.hdfs.hdfs.rollCount      = 0
agent1.sinks.hdfs.hdfs.idleTimeout    = 10
agent1.sinks.hdfs.hdfs.maxOpenFiles   = 64
