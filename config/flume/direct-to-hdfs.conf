# Architecture B, Flume branch: tail the live access log and write the raw lines
# straight to HDFS, one folder per day.
#
#   TAILDIR source -> file channel -> HDFS sink (/data/nasa/raw/flume/dt=YYYY-MM-DD)
#
# The regex_extractor interceptor copies the request time written in the log line
# (e.g. [01/Jul/1995:00:00:01 -0400]) into the "timestamp" header, which picks the day
# folder. The static interceptor runs first and sets timestamp=0, so a line without a
# readable date lands in dt=1970-01-01 instead of stopping the sink.

direct.sources  = tail
direct.channels = disk
direct.sinks    = hdfs

# --- Source -----------------------------------------------------------------
direct.sources.tail.type               = TAILDIR
direct.sources.tail.channels           = disk
direct.sources.tail.filegroups         = access
direct.sources.tail.filegroups.access  = /data/live/parallel/access.log
direct.sources.tail.positionFile       = /var/lib/flume/taildir-position.json
direct.sources.tail.batchSize          = 500

direct.sources.tail.interceptors                          = fallback eventtime
direct.sources.tail.interceptors.fallback.type            = static
direct.sources.tail.interceptors.fallback.key             = timestamp
direct.sources.tail.interceptors.fallback.value           = 0
direct.sources.tail.interceptors.eventtime.type           = regex_extractor
direct.sources.tail.interceptors.eventtime.regex          = \\[(\\d{2}/[A-Za-z]{3}/\\d{4}:\\d{2}:\\d{2}:\\d{2})
direct.sources.tail.interceptors.eventtime.serializers    = millis
direct.sources.tail.interceptors.eventtime.serializers.millis.type    = org.apache.flume.interceptor.RegexExtractorInterceptorMillisSerializer
direct.sources.tail.interceptors.eventtime.serializers.millis.name    = timestamp
direct.sources.tail.interceptors.eventtime.serializers.millis.pattern = dd/MMM/yyyy:HH:mm:ss

# --- Channel: file-backed so buffered events survive a restart ---------------
direct.channels.disk.type                = file
direct.channels.disk.checkpointDir       = /var/lib/flume/checkpoint
direct.channels.disk.dataDirs            = /var/lib/flume/data
direct.channels.disk.capacity            = 1000000
direct.channels.disk.transactionCapacity = 10000

# --- Sink -------------------------------------------------------------------
# Files being written start with "_" so Hive never reads a half-written file.
direct.sinks.hdfs.type                = hdfs
direct.sinks.hdfs.channel             = disk
direct.sinks.hdfs.hdfs.path           = hdfs://hadoop:9000/data/nasa/raw/flume/dt=%Y-%m-%d
direct.sinks.hdfs.hdfs.timeZone       = UTC
direct.sinks.hdfs.hdfs.filePrefix     = weblogs
direct.sinks.hdfs.hdfs.inUsePrefix    = _
direct.sinks.hdfs.hdfs.fileType       = DataStream
direct.sinks.hdfs.hdfs.writeFormat    = Text
direct.sinks.hdfs.hdfs.batchSize      = 1000
direct.sinks.hdfs.hdfs.rollInterval   = 30
direct.sinks.hdfs.hdfs.rollSize       = 134217728
direct.sinks.hdfs.hdfs.rollCount      = 0
direct.sinks.hdfs.hdfs.idleTimeout    = 10
direct.sinks.hdfs.hdfs.maxOpenFiles   = 64
