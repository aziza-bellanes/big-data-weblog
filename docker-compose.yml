name: weblogs-pipeline

# Three ingestion branches start together and each one ends in HDFS
# (folders, topic and databases in config/architectures.json):
#   Flume   replayer -> live log -> flume-direct -> HDFS raw lines (batch layer, Hive)
#   Kafka   kafka-producer -> topic "web-events" -> kafka-hdfs-writer -> HDFS JSON events
#                                                -> spark-streaming   -> HDFS Parquet + MySQL
#                                                   (speed layer: per-minute figures, alerts)
#   Sqoop   MySQL status_codes -> HDFS reference data

# Settings shared by every container built from docker/bigdata.
x-bigdata: &bigdata
  image: weblogs/bigdata:latest
  pull_policy: never
  restart: unless-stopped
  environment:
    KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  volumes:
    - ./:/opt/project:ro

# Flume agents and the Kafka HDFS writer expose JSON metrics on this port; the service
# is healthy once it answers.
x-flume-healthcheck: &flume-healthcheck
  test: ["CMD", "curl", "-fs", "-o", "/dev/null", "http://localhost:34545/metrics"]
  interval: 10s
  start_period: 30s
  retries: 6

services:
  # ---- Storage and reference data -------------------------------------------
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
      - ./mysql/schema:/opt/mysql/schema:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      retries: 12

  hadoop:
    <<: *bigdata
    build:
      context: .
      dockerfile: docker/bigdata/Dockerfile
    pull_policy: build
    hostname: hadoop
    command: ["hadoop"]
    ports:
      - "127.0.0.1:9870:9870"    # HDFS NameNode UI
      - "127.0.0.1:8088:8088"    # YARN ResourceManager UI
      - "127.0.0.1:19888:19888"  # MapReduce job history UI
    volumes:
      - ./:/opt/project:ro
      - hadoop-data:/var/lib/hadoop
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/hadoop.ready && python3 /opt/project/scripts/cluster_ready.py"]
      interval: 10s
      timeout: 8s
      start_period: 60s
      retries: 18

  # ---- Messaging -------------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    restart: unless-stopped
    depends_on: [zookeeper]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      start_period: 20s
      retries: 12

  # Topic of the Kafka branch: one JSON event per log line.
  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      kafka: { condition: service_healthy }
    restart: "no"
    command:
      - bash
      - -c
      - |
        kafka-topics --bootstrap-server=kafka:9092 --create --if-not-exists \
          --topic=web-events --partitions=3 --replication-factor=1

  # ---- Ingestion -------------------------------------------------------------
  # Replays the NASA logs into the live log tailed by Flume (make replay).
  replayer:
    <<: *bigdata
    command: ["replayer"]
    restart: "no"
    profiles: [replay]
    environment:
      REPLAY_RATE: ${REPLAY_RATE:-500}
      REPLAY_LIMIT: ${REPLAY_LIMIT:-0}
    volumes:
      - ./:/opt/project:ro
      - ./data/raw:/data/input:ro
      - live-logs:/data/live

  # Flume and Kafka branches (the Sqoop import runs in the client container)
  flume-direct:
    <<: *bigdata
    command: ["flume", "direct", "/opt/project/config/flume/direct-to-hdfs.conf"]
    depends_on:
      hadoop: { condition: service_healthy }
    volumes:
      - ./:/opt/project:ro
      - live-logs:/data/live:ro
      - flume-direct-state:/var/lib/flume
    healthcheck: *flume-healthcheck

  kafka-producer:
    <<: *bigdata
    command: ["python3", "/opt/project/scripts/kafka_ingestion.py", "produce"]
    restart: "no"
    profiles: [replay]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REPLAY_RATE: ${REPLAY_RATE:-500}
      REPLAY_LIMIT: ${REPLAY_LIMIT:-0}
    depends_on:
      kafka-init: { condition: service_completed_successfully }
      # The speed layer starts at the end of the topic: it must listen before events arrive.
      spark-streaming: { condition: service_healthy }
    volumes:
      - ./:/opt/project:ro
      - ./data/raw:/data/input:ro
      - live-logs:/data/live

  kafka-hdfs-writer:
    <<: *bigdata
    command: ["python3", "/opt/project/scripts/kafka_ingestion.py", "consume"]
    depends_on:
      kafka-init: { condition: service_completed_successfully }
      hadoop: { condition: service_healthy }
    healthcheck: *flume-healthcheck

  # Second consumer of "web-events": Spark Structured Streaming computes per-minute
  # traffic, errors and alerts while the run goes on, and writes them to HDFS (Parquet)
  # and to MySQL for the dashboard (scripts/spark_speed_layer.py).
  spark-streaming:
    <<: *bigdata
    command: ["spark-submit", "--master", "local[2]", "--driver-memory", "1g",
              "--conf", "spark.driver.extraJavaOptions=-Duser.timezone=UTC",
              "/opt/project/scripts/spark_speed_layer.py"]
    depends_on:
      kafka-init: { condition: service_completed_successfully }
      hadoop: { condition: service_healthy }
      mysql: { condition: service_healthy }
    mem_limit: 2g
    healthcheck:
      # Healthy once the query has run its first trigger (its Kafka start is fixed).
      test: ["CMD", "test", "-f", "/tmp/speed-layer.ready"]
      interval: 10s
      start_period: 60s
      retries: 12

  # ---- Analysis and export ---------------------------------------------------
  hive:
    <<: *bigdata
    command: ["hive"]
    depends_on:
      mysql: { condition: service_healthy }
      hadoop: { condition: service_healthy }
    ports:
      - "127.0.0.1:10000:10000"  # HiveServer2 JDBC
      - "127.0.0.1:10002:10002"  # HiveServer2 UI
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/10000'"]
      interval: 15s
      start_period: 90s
      retries: 20

  client:
    <<: *bigdata
    command: ["client"]
    depends_on:
      mysql: { condition: service_healthy }
      hadoop: { condition: service_healthy }
    volumes:
      - ./:/opt/project:ro
      - ./data/raw:/data/input:ro
      # Read-write so the dashboard can start a replay through the control API.
      - live-logs:/data/live
      # Run records kept by the control API.
      - runs:/data/runs
      - ./artifacts:/opt/artifacts
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 6

  # ---- Web dashboard -----------------------------------------------------------
  dashboard:
    build: ./dashboard
    image: weblogs/dashboard:latest
    restart: unless-stopped
    depends_on:
      mysql: { condition: service_healthy }
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      CONTROL_URL: http://client:8000
      ARCHITECTURES_FILE: /config/architectures.json
    ports:
      - "127.0.0.1:${DASHBOARD_HOST_PORT:-3030}:3000"
    volumes:
      - live-logs:/data/live:ro
      # Folders, topics and databases of both architectures, shared with the scripts.
      - ./config/architectures.json:/config/architectures.json:ro

volumes:
  mysql-data:
  hadoop-data:
  zookeeper-data:
  kafka-data:
  live-logs:
  runs:
  flume-direct-state:
