# Flume agent 2: consume the Kafka topic and write raw lines to HDFS, one folder per day.
#
#   Kafka source -> file channel -> HDFS sink (/data/weblogs/dt=YYYY-MM-DD/)
#
# The "timestamp" header comes from agent 1 (time of the request in the log line).
# Lines agent 1 could not parse have no such header; the timestamp interceptor below
# fills it with the ingestion time (preserveExisting keeps real ones), so those lines
# land in today's partition and Hive reports them as malformed.

agent2.sources  = kafka
agent2.channels = disk
agent2.sinks    = hdfs

# --- Source -----------------------------------------------------------------
agent2.sources.kafka.type                       = org.apache.flume.source.kafka.KafkaSource
agent2.sources.kafka.channels                   = disk
agent2.sources.kafka.kafka.bootstrap.servers    = ${KAFKA_BOOTSTRAP_SERVERS}
agent2.sources.kafka.kafka.topics               = ${KAFKA_TOPIC}
agent2.sources.kafka.kafka.consumer.group.id    = flume-hdfs-writer
agent2.sources.kafka.kafka.consumer.auto.offset.reset = earliest
agent2.sources.kafka.useFlumeEventFormat        = true
agent2.sources.kafka.batchSize                  = 1000
agent2.sources.kafka.batchDurationMillis        = 2000

agent2.sources.kafka.interceptors                         = fallback
agent2.sources.kafka.interceptors.fallback.type           = timestamp
agent2.sources.kafka.interceptors.fallback.preserveExisting = true

# --- Channel ----------------------------------------------------------------
agent2.channels.disk.type                = file
agent2.channels.disk.checkpointDir       = /var/lib/flume/checkpoint
agent2.channels.disk.dataDirs            = /var/lib/flume/data
agent2.channels.disk.capacity            = 1000000
agent2.channels.disk.transactionCapacity = 10000

# --- Sink -------------------------------------------------------------------
# Files being written start with "_" so Hive never reads a half-written file.
agent2.sinks.hdfs.type                = hdfs
agent2.sinks.hdfs.channel             = disk
agent2.sinks.hdfs.hdfs.path           = hdfs://hadoop:9000/data/weblogs/dt=%Y-%m-%d
agent2.sinks.hdfs.hdfs.timeZone       = UTC
agent2.sinks.hdfs.hdfs.filePrefix     = weblogs
agent2.sinks.hdfs.hdfs.inUsePrefix    = _
agent2.sinks.hdfs.hdfs.fileType       = DataStream
agent2.sinks.hdfs.hdfs.writeFormat    = Text
agent2.sinks.hdfs.hdfs.batchSize      = 1000
agent2.sinks.hdfs.hdfs.rollInterval   = 300
agent2.sinks.hdfs.hdfs.rollSize       = 134217728
agent2.sinks.hdfs.hdfs.rollCount      = 0
agent2.sinks.hdfs.hdfs.idleTimeout    = 60
agent2.sinks.hdfs.hdfs.maxOpenFiles   = 64
