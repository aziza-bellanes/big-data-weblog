<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-label="Three independent ingestion branches converging on HDFS"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#173B57"/></marker></defs><g font-family="sans-serif"><text x="20" y="22" fill="#173B57" font-size="16">Independent ingestion → separate HDFS zones</text><g transform="translate(20,45)"><rect width="230" height="60" rx="8" fill="#0B4A6F"/><text x="115" y="25" text-anchor="middle" fill="white" font-size="15">Flume: NASA raw logs</text><text x="115" y="45" text-anchor="middle" fill="white" font-size="10">Taildir → file channel → HDFS</text></g><g transform="translate(285,45)"><rect width="230" height="60" rx="8" fill="#0B4A6F"/><text x="115" y="25" text-anchor="middle" fill="white" font-size="15">Kafka: NASA JSON events</text><text x="115" y="45" text-anchor="middle" fill="white" font-size="10">Producer → broker → dedicated writer</text></g><g transform="translate(550,45)"><rect width="230" height="60" rx="8" fill="#0B4A6F"/><text x="115" y="25" text-anchor="middle" fill="white" font-size="15">Sqoop: reference import</text><text x="115" y="45" text-anchor="middle" fill="white" font-size="10">MySQL status_codes → HDFS</text></g><g stroke="#173B57" stroke-width="2" fill="none" marker-end="url(#a)"><path d="M135 105L135 140L400 140L400 165"/><path d="M400 105L400 165"/><path d="M665 105L665 140L400 140"/><path d="M400 225L400 265"/></g><g transform="translate(285,165)"><rect width="230" height="60" rx="8" fill="#0B4A6F"/><text x="115" y="25" text-anchor="middle" fill="white" font-size="15">HDFS</text><text x="115" y="45" text-anchor="middle" fill="white" font-size="10">raw/flume · streaming/kafka · reference/sqoop</text></g><g transform="translate(285,265)"><rect width="230" height="60" rx="8" fill="#0B4A6F"/><text x="115" y="25" text-anchor="middle" fill="white" font-size="15">Hive → Sqoop export → MySQL</text><text x="115" y="45" text-anchor="middle" fill="white" font-size="10">Canonical analytics → reporting → dashboard</text></g><text x="20" y="350" font-size="12" fill="#173B57">Flume is canonical. Kafka represents the same requests. Never sum both streams.</text></g></svg>